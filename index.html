<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Aumicão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
    <h1>🐾 Shop Aumicão</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#servicos">Serviços</a>
        <a href="#contato">Contato</a>
    </nav>
</header>

<main>

<section class="destaque">
    <div class="texto">
        <h2>O melhor cuidado para seu pet</h2>
        <p>Carinho e qualidade que seu amigo merece.</p>
        <button>Agendar</button>
    </div>

    <div class="imagem">
        <img src="https://images.unsplash.com/photo-1507146426996-ef05306b995a" alt="">
    </div>
</section>

<section id="servicos" class="servicos">
    <h2>Serviços</h2>

    <div class="lista">
        <div class="item">
            <img src="https://images.unsplash.com/photo-1518717758536-85ae29035b6d">
            <h3>Banho e Tosa</h3>
        </div>

        <div class="item">
            <img src="https://images.unsplash.com/photo-1576201836106-db1758fd1c97">
            <h3>Veterinário</h3>
        </div>

        <div class="item">
            <img src="https://images.unsplash.com/photo-1598133894009-61f4b9c93b2f">
            <h3>Produtos</h3>
        </div>
    </div>
</section>

</main>

<footer id="contato">
    <p>Rua do vento, 33</p>
    <p>(11) 95769-6655</p>
</footer>

</body>
</html>
